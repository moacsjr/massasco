services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devxp
    ports:
      - '5432:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  app: # <-- Esse nome deve ser o mesmo do "service" no devcontainer.json
    image: mcr.microsoft.com/devcontainers/typescript-node:4-24-trixie
    volumes:
      - ..:/workspace
    
    # Mantém o container vivo em segundo plano para o VS Code se conectar
    command: /bin/sh -c "while sleep 1000; do :; done" 
    # Dummy values so the app starts; S3 is not available locally

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@massas.co
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "5050:80"
    depends_on:
      - db
