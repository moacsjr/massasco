version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devxp
    ports:
      - '5432:5432'
    volumes:
      - devxp_local_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/devxp?schema=public
      NEXT_PUBLIC_CDN_URL: http://localhost:3000
      AWS_S3_BUCKET_NAME: devxp-media-local
    # Dummy values so the app starts; S3 is not available locally

volumes:
  devxp_local_data:
