services:
  app:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-us-east-1}.amazonaws.com/devxp-app:latest
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - /home/ec2-user/meu-app/apps/app/.env
    # DATABASE_URL is provided via .env file (populated from GitHub Actions secret)