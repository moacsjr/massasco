default_stages: [pre-commit]

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-json
        exclude: 'tsconfig.*\.json$' # tsconfig allows comments (JSONC)
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Prettier — formatting for TS, JS, JSON, CSS, YAML, Markdown
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: pnpm prettier --write --ignore-unknown
        types_or: [javascript, jsx, ts, tsx, json, css, scss, yaml, markdown]
        pass_filenames: true

  # ESLint — lint + autofix for TS/JS files
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: pnpm eslint --fix --no-warn-ignored
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true

  # Terraform — format HCL files
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
