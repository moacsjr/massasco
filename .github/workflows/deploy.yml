name: CI/CD Pipeline - AWS CodeDeploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build Application
        run: pnpm nx build app

      - name: Package Artifact
        # Ship build outputs and node_modules so the EC2 host does zero build work.
        # tar.gz preserves pnpm's symlinks; zip+rubyzip (CodeDeploy) does not.
        # Write the tarball outside the workspace so tar doesn't see its own
        # output as "file changed as we read it".
        run: |
          echo "Packaging application for deployment..."
          tar --exclude='./.git*' \
              --exclude='./.nx/cache' \
              --exclude='./tmp' \
              --exclude='./test-results' \
              --exclude='./e2e/test-results' \
              --exclude='./playwright-report' \
              -czf "$RUNNER_TEMP/deploy.tgz" .
          mv "$RUNNER_TEMP/deploy.tgz" deploy.tgz

      - name: Verify bundle contents
        run: |
          echo "Top-level entries in deploy.tgz:"
          tar -tzf deploy.tgz | awk -F/ '{print $2}' | sort -u | head -50
          echo "---"
          echo "scripts/ entries in bundle:"
          tar -tzf deploy.tgz | grep -E '^\./scripts/' || (echo "ERROR: scripts/ not in bundle" && exit 1)
          echo "---"
          echo "appspec.yml present:"
          tar -tzf deploy.tgz | grep -E '^\./appspec\.yml$' || (echo "ERROR: appspec.yml missing" && exit 1)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Artifact to S3
        run: |
          aws s3 cp deploy.tgz s3://${{ vars.S3_BUCKET_NAME }}/deploy-${{ github.sha }}.tgz

      - name: Trigger AWS CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{  vars.CODEDEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=${{ vars.S3_BUCKET_NAME }},key=deploy-${{ github.sha }}.tgz,bundleType=tgz
